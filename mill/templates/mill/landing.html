<!DOCTYPE html>
<html>
<head><title>MafutaPro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui;background:#f0fdf4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:white;padding:40px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.1);width:90%;max-width:400px;text-align:center}
h1{color:#0f6b4a;font-size:32px;margin:0}
p{color:#666}
.btn{display:block;padding:14px;margin:12px 0;border-radius:10px;text-decoration:none;font-weight:bold;text-align:center}
.btn-green{background:#0f6b4a;color:white}
.btn-outline{border:2px solid #0f6b4a;color:#0f6b4a}
</style>
</head>
<body>
<div class="card">
<h1>🌻 MafutaPro</h1>
<p>Mfumo wa Viwanda vya Mafuta Tanzania</p>
<a class="btn btn-green" href="/login/">Sign In</a>
<a class="btn btn-outline" href="/register/">Sign Up - Fungua Kiwanda</a>
<p style="font-size:12px;margin-top:20px">Tayari una kiwanda? Ingia uendelee.</p>
</div>
</body>
</html>
