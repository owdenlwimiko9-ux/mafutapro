{% extends 'mill/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto">
<h2 class="text-2xl font-black mb-6">Kukamua za Kiwanda - Kwa Kuuza</h2>
<p class="text-sm text-gray-500 mb-4">Hii ni alizeti ulizonunua wewe mwenyewe, ukasaga ili uuze mafuta</p>
<form method="post" class="bg-white p-8 rounded-2xl shadow-sm border space-y-5">
{% csrf_token %}
<div class="grid grid-cols-3 gap-4">
<div><label class="text-xs font-bold">Mbegu Zako KG</label><input name="seed_weight" type="number" step="0.01" required class="w-full border p-3 rounded-xl mt-1 bg-gray-50"></div>
<div><label class="text-xs font-bold">Mafuta Yaliyotoka L</label><input name="oil_produced" type="number" step="0.01" required class="w-full border p-3 rounded-xl mt-1 bg-yellow-50 font-bold"></div>
<div><label class="text-xs font-bold">Mashudu KG</label><input name="cake_produced" type="number" step="0.01" class="w-full border p-3 rounded-xl mt-1"></div>
</div>
<div><label class="text-xs font-bold">Gharama ya Kununua Alizeti (TZS)</label><input name="buying_cost" type="number" placeholder="mf: 150000 kwa KG 100" class="w-full border p-3 rounded-xl mt-1"></div>
<div class="bg-green-50 p-3 rounded-xl border border-green-100 text-xs">
Mafuta L yataingia moja kwa moja kwenye Stock ya Kuuza. Utaona kwenye Dashboard: Oil Stock +
</div>
<button class="w-full bg-black text-white py-4 rounded-xl font-bold">Hifadhi - Ingiza Kwenye Stock ya Kuuza</button>
</form>
</div>
{% endblock %}
