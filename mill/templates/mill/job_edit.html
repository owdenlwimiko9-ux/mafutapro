{% extends 'mill/base.html' %}
{% block content %}
<h2 class="font-black text-xl mb-4">Hariri Kazi #{{ job.id }}</h2>
<form method="POST" class="bg-white p-6 rounded-2xl border space-y-3 max-w-lg">
  {% csrf_token %}
  <select name="customer" class="w-full border rounded-xl p-3">
    {% for c in customers %}
    <option value="{{ c.id }}" {% if job.customer and job.customer.id == c.id %}selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>
  <input type="number" step="0.01" name="seed_weight" value="{{ job.seed_weight_kg }}" class="w-full border rounded-xl p-3" placeholder="Mbegu KG" required>
  <input type="number" step="0.01" name="oil_produced" value="{{ job.oil_produced_litre }}" class="w-full border rounded-xl p-3" placeholder="Mafuta L">
  <input type="number" step="0.01" name="cake_produced" value="{{ job.cake_produced_kg }}" class="w-full border rounded-xl p-3" placeholder="Mashudu KG">
  <select name="service_type" class="w-full border rounded-xl p-3">
    <option value="CASH" {% if job.service_type == 'CASH' %}selected{% endif %}>Cash</option>
    <option value="SHARE" {% if job.service_type == 'SHARE' %}selected{% endif %}>Oil Sharing</option>
    <option value="MASHUDU" {% if job.service_type == 'MASHUDU' %}selected{% endif %}>Keep Cake</option>
    <option value="OWNER" {% if job.service_type == 'OWNER' %}selected{% endif %}>Kiwanda</option>
  </select>
  <input type="number" step="0.01" name="service_cost" value="{{ job.service_cost }}" class="w-full border rounded-xl p-3" placeholder="Gharama">
  <input type="number" step="0.01" name="amount_paid" value="{{ job.amount_paid }}" class="w-full border rounded-xl p-3" placeholder="Kiasi Kilicholipwa">
  <textarea name="notes" class="w-full border rounded-xl p-3" placeholder="Notes">{{ job.notes }}</textarea>
  <button class="w-full bg-black text-white py-3 rounded-full font-black">Hifadhi Mabadiliko</button>
</form>
{% endblock %}
