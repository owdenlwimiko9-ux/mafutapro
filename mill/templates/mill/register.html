<!DOCTYPE html>
<html>
<head><title>Register - MafutaPro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:system-ui;background:#f0fdf4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}.card{background:white;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:90%;max-width:400px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#0f6b4a;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}a{color:#0f6b4a}</style>
</head>
<body>
<div class="card">
<h2>Sign Up - Fungua Kiwanda</h2>
{% if messages %}{% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}{% endif %}
<form method="post">{% csrf_token %}
<input name="username" placeholder="Username" required>
<input name="email" type="email" placeholder="Email" required>
<input name="mill_name" placeholder="Jina la Kiwanda - ex: Willa Foods" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Tengeneza Account & Kiwanda</button>
</form>
<p style="text-align:center;margin-top:15px">Tayari una account? <a href="/login/">Sign In</a></p>
</div>
</body>
</html>
