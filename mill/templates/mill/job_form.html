{% extends 'mill/base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
<div class="bg-white rounded-2xl border p-6">
<h2 class="text-xl font-black mb-4">Kazi Mpya ya Kukamua</h2>

<div class="flex gap-2 mb-6">
<button type="button" onclick="showMteja()" id="btnMteja" class="flex-1 py-2 rounded-full font-bold text-sm bg-black text-white">Mteja Analeta</button>
<button type="button" onclick="showKiwanda()" id="btnKiwanda" class="flex-1 py-2 rounded-full font-bold text-sm bg-gray-100">Alizeti za Kiwanda (Kuuza)</button>
</div>

<!-- MTEJA FORM -->
<form method="POST" id="formMteja" class="space-y-3">
{% csrf_token %}
<input type="hidden" name="form_type" value="MTEJA">
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs font-bold uppercase text-gray-500">Jina la Mteja</label>
<input type="text" name="new_customer_name" class="w-full border rounded-xl p-3">
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Simu</label>
<input type="text" name="new_customer_phone" class="w-full border rounded-xl p-3" placeholder="07...">
</div>
</div>
<div class="grid grid-cols-3 gap-3">
<div>
<label class="text-xs font-bold uppercase text-gray-500">Alizeti KG</label>
<input type="number" step="0.01" name="seed_weight" class="w-full border rounded-xl p-3 font-bold" required>
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Mafuta L</label>
<input type="number" step="0.01" name="oil_produced" class="w-full border rounded-xl p-3 font-bold">
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Mashudu KG</label>
<input type="number" step="0.01" name="cake_produced" class="w-full border rounded-xl p-3">
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-xs font-bold uppercase text-gray-500">Gharama ya Kukamua</label>
<input type="number" step="0.01" name="service_cost" class="w-full border rounded-xl p-3 font-bold" required>
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Alicholipa</label>
<input type="number" step="0.01" name="amount_paid" class="w-full border rounded-xl p-3 font-bold" required>
</div>
</div>
<button class="w-full bg-black text-white py-3 rounded-full font-black">Hifadhi Kazi ya Mteja</button>
</form>

<!-- KIWANDA FORM -->
<form method="POST" id="formKiwanda" class="space-y-3 hidden">
{% csrf_token %}
<input type="hidden" name="form_type" value="KIWANDA">
<p class="text-xs bg-amber-50 border border-amber-200 p-3 rounded-xl">Hii ni alizeti zako mwenyewe - ukasaga ili uuze mafuta. Itaingia moja kwa moja kwenye Stock ya Mafuta ya Kuuza</p>
<div class="grid grid-cols-3 gap-3">
<div>
<label class="text-xs font-bold uppercase text-gray-500">Alizeti Zako KG</label>
<input type="number" step="0.01" name="seed_weight_owner" class="w-full border rounded-xl p-3 font-bold" required>
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Mafuta L</label>
<input type="number" step="0.01" name="oil_produced_owner" class="w-full border rounded-xl p-3 font-bold" required>
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Mashudu KG</label>
<input type="number" step="0.01" name="cake_produced_owner" class="w-full border rounded-xl p-3">
</div>
</div>
<div>
<label class="text-xs font-bold uppercase text-gray-500">Gharama ya Kununua Alizeti (TZS) *</label>
<input type="text" name="buying_cost" class="w-full border rounded-xl p-3 font-bold" placeholder="150000" required>
<p class="text-[11px] text-gray-500 mt-1">Andika namba tu, mf: 150000</p>
</div>
<button class="w-full bg-orange-500 text-white py-3 rounded-full font-black">Hifadhi Kiwanda - Ingiza Kwenye Stock ya Kuuza</button>
</form>

</div>
</div>

<script>
function showMteja(){
  document.getElementById('formMteja').classList.remove('hidden');
  document.getElementById('formKiwanda').classList.add('hidden');
  document.getElementById('btnMteja').className='flex-1 py-2 rounded-full font-bold text-sm bg-black text-white';
  document.getElementById('btnKiwanda').className='flex-1 py-2 rounded-full font-bold text-sm bg-gray-100';
}
function showKiwanda(){
  document.getElementById('formKiwanda').classList.remove('hidden');
  document.getElementById('formMteja').classList.add('hidden');
  document.getElementById('btnKiwanda').className='flex-1 py-2 rounded-full font-bold text-sm bg-black text-white';
  document.getElementById('btnMteja').className='flex-1 py-2 rounded-full font-bold text-sm bg-gray-100';
}
</script>
{% endblock %}
